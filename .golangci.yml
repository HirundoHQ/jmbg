version: "2"

run:
  timeout: 10m

linters:
  enable:
    - asciicheck
    - dupl
    - errname
    - goconst
    - gocyclo
    - misspell
    - nilerr
    - perfsprint
    - revive
    - unconvert
  settings:
    gocyclo:
      min-complexity: 22
  exclusions:
    rules:
      # Region names in the data table legitimately repeat in tests.
      - path: regions\.go
        linters:
          - goconst
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - funlen
          - goconst

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
